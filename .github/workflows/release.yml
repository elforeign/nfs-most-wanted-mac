name: Release

# On a version tag, builds the Setup app (no game files involved) and attaches its disk image to the release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  setup-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build the Setup app
        run: sh tools/installer/build_installer.sh "${{ github.ref_name }}"
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file CHANGELOG.md
          gh release upload "${{ github.ref_name }}" dist/NFS-Most-Wanted-Native-Setup-*.dmg dist/NFS-Most-Wanted-Native-Setup-*.dmg.sha256 --clobber
