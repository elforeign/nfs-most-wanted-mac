    { at = 0x006cf4f3, text = "FDIV float ptr [0x00a37814]" },
    { at = 0x006e4656, text = "FLD float ptr [0x00a37814]" },
    { at = 0x006e4668, text = "NOP" },
    { at = 0x006e47e4, text = "FLD float ptr [0x00a37814]" },
