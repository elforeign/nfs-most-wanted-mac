[hooks]
# runtime/kernel32.cpp native_frame_clock: GetTickCount return addresses of
# the draw-loop waits. Not identified; sentinels (never a return address).
frame_clock_begin = 0x00a37f10
frame_clock_wait = 0x00a37f14
frame_clock_wait_clamp = 0x00a37f18
frame_clock_clamp_deadline = 0x00a37f20
frame_clock_wait_deadline = 0x00a37f24
# dx/ddraw.cpp: mouse-pointer surface globals. This game draws with Direct3D 9
# and never creates DirectDraw surfaces; sentinels.
cursor_surface_ptrs = [0x00a37f30, 0x00a37f34]
# host/input_gate.cpp: the game's mouse device object and its vtable.
# Not identified (the game uses DirectInput8Create); sentinels.
mouse_vtable = 0x00a37f40
mouse_device_ptr = 0x00a37f44
mouse_device_right = 0x00a37f48
# host/smoke_main.cpp: the camera record the smoke script inspects. Sentinel.
camera = 0x00a37f50
# mods/game_view.cpp: Populous's seven sprite routines. This game has none.
sprites = []

[mods]
# The mod runtime's Populous integrations hook Populous routines by address;
# this game has none of them.
builtin = "none"

[settings]
# Renderer settings are supplied by this game's core mod. The shared page
# also exposes touch layout selection and button remapping on the iPad.
rows = ["window", "frame_limit", "performance_overlay", "filtering", "controls"]
# 3.0.4: the core mod whose settings the host reads for its own features (mute in background, deadzones, brightness).
core_mod = "core.nfsmw"
# World filtering (Test72): "original" keeps the game's own texture filtering, so a profile that
# never chose a value looks as before; 2-4 raise the anisotropy where the game filters anisotropically.
filtering_default = 0
# Profiles already hold a host.display/texture_filtering value the Metal renderer never used (the
# row was unlisted); a new key keeps that stale value from switching on.
filtering_key = "world_filtering"
page = "tabs"

[controls]
pad = "native"

[controls.native]
# One native DirectInput device retains analog steering. Game action bindings
# are verified in the isolated Mac profile before it becomes a release preset.
xinput = false
dinput = true
axes = ["x", "y", "z", "rz", "rx", "ry"]
buttons = ["square", "cross", "circle", "triangle", "l1", "r1", "l2", "r2", "select", "start", "l3", "r3", "ps"]

[controls.mapped]
# Racing preset over the game's default PC keys. The 2005 executable reads
# DirectInput, not XInput; generic native joystick defaults are not this layout.
# Triangle confirms menus; Start pauses/goes back; dpad navigates menus.
left_stick = "horizontal_arrows"
right_stick = "cursor"
dpad = "arrows"
cross = "key:Up"
square = "key:Down"
circle = "key:Space"
triangle = "key:Return"
l1 = "key:Tab"
r1 = "key:LShift"
l2 = "key:Down"
r2 = "key:Up"
l3 = "none"
r3 = "mouse_left"
select = "key:C"
start = "key:Escape"

[launcher]
# 3.0.4: "Check for updates" (Settings, an opt-in button) asks this repository's latest GitHub release.
releases_repo = "elforeign/nfs-most-wanted-mac"
# 3.0.4: the Setup app's build log (relative to the home folder), which Save bug report adds: it names the compiler.
setup_log = "Library/NFSMW-Native-Setup/source/build/setup.log"
# Opens when the executable is missing or wrong, with --launcher,
# RECOMP_LAUNCHER=1, or Shift/Alt held at start. No store sells this game
# (checked 2026-09-17): GOG only lists it on its Dreamlist, and Steam's "Most
# Wanted" (app 1262560) is Criterion's 2012 game, a different executable. So
# store, gog_ids and steam_ids stay empty; detection goes by install_names.
title = "Need for Speed: Most Wanted"
install_names = ["Need for Speed Most Wanted", "NFS Most Wanted", "Most Wanted"]
min_free_mb = 300

[setup]
# tools/setup.py: what a supported installation must contain. No annotation
# metadata exists for this executable; tools/analyze.py runs Ghidra's own
# analysis instead of importing one.
required_dirs = ["CARS", "FRONTEND", "GLOBAL", "SOUND", "TRACKS"]

[bundle]
# Left out of the iOS bundle: the uninstaller, the manual, the Windows-only
# ASI loader and widescreen fix, LAN server, installer helpers and the
# repack's saves. The VP6 cinematics stay: the game decodes them itself.
exclude = ["Uninstall", "Support", "scripts", "SAVE", "foobar",
           "*.dll", "*_inst.exe", "*.txt", "server.cfg"]
