    # Native frame arena: PC1.3 allocates TWO separate buffers, each0x64000.
    # Test43 proved MAIN vehicle rejection on exhaustion; Test44 verified
    # one swap/reset per render frame. Preserve allocation ownership/alignment,
    # allocator comparisons and double-buffer lifetime;4MiB each,8MiB total.
    { at = 0x005009d1, text = "PUSH 0x400000" },
    { at = 0x005009db, text = "PUSH 0x400000" },
    { at = 0x00500a00, text = "ADD EAX,0x400000" },
    { at = 0x00500a0c, text = "MOV dword ptr [0x00915f7c],0x400000" },
