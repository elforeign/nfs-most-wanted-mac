; Native Most Wanted: editable settings for this profile.
; F10 (or Fn+F10) opens native settings. Values are saved automatically.
; Uncomment an entry below to override its saved value on each launch.
; Quit before editing. Changes to this file take effect on the next launch.
; Comment an entry again to let F10 control it; its last value stays saved.
; To restore defaults, choose the values below in F10 or uncomment them.
; Unsupported PC ASI options are ignored and logged, never silently enabled.

[Native]
; trigger_pedals = 0       ; 0: L2/R2 shift; 1: L2 brake, R2 throttle (analog)
; ps2_controls = 1        ; the default layout (Options > Controls changes any driving button)
; impact_rumble = 100    ; collision strength %, 0 off, 200 maximum
; surface_rumble = 100   ; driving rumble %, 0 off, 200 maximum
; rumble_floor = 1       ; rumble cut-off %: weaker motor levels are not played, 0 off
; surround_audio = 0    ; 1: discrete 5.1 PCM output; 0: the Audio Mode's Mono/Stereo
; Also selectable in Options > Audio > Audio Mode (Mono, Stereo, 5.1 PCM): each
; choice is heard immediately while cycling; Accept keeps it, Back discards it.
; The game always mixes in its original discrete 5.1 mode; Mono and Stereo are
; ITU fold-downs of that mix.
; audio_center_lfe_swap = 0  ; 1 only if a listening test shows dialogue muffled
;   and the subwoofer channel clear (some TV/soundbar HDMI chains swap them)
; audio_dolby_digital = 0    ; 1: send the mix as a Dolby Digital 5.1 bitstream
;   (AC-3, 640 kbps) over HDMI/optical, as game consoles do. Use it when a TV or
;   soundbar puts multichannel PCM in the wrong speakers: Dolby Digital carries
;   its own speaker roles, so audio_center_lfe_swap is ignored. The game takes
;   exclusive use of the output while running (macOS moves other apps' sound to
;   another output until you quit) and restores the output's format on exit,
;   also after a crash, at the next launch. Movies are included. If the device
;   cannot take a bitstream, PCM is used and the log says why.
; An active INI override wins at launch over either menu's saved choice.
; Six-channel speakers require a compatible configured output. Stereo outputs
; are downmixed by macOS/SDL. Atmos/height channels are not produced.
; ps_icons = 1
; Button IDs: -1 disabled; 0 Square; 1 Cross; 2 Circle; 3 Triangle;
; 4 L1; 5 R1; 6 L2; 7 R2; 8 Create; 9 Options; 10 L3; 11 R3.
; A button also assigned to another action will do both. Avoid collisions.
; With trigger_pedals=1, shift assignments to L2/R2 are suppressed.
; shift_down = 6
; shift_up = 7
; shift_down_secondary = -1
; shift_up_secondary = -1
; mirror_full_scenery = 1
; mod_lighting = 1       ; disables legacy PC colour filter, overbright and blur
; mod_hq_preset = 1      ; top detail slider uses HQ; custom lower settings stay
; movie_fit = 1          ; fit converted widescreen movies without cropping
; mirror_neutral_exposure = 1
; mirror_hd = 1
; mirror_shadows = 0      ; world shadows in the mirror (about 1.4 ms per frame)
; mirror_look_back = 0    ; 1 keeps the mirror while looking back
; texture_pack = 1      ; a TexWizard texture pack installed in the game folder (setup builds its map)
; fov_scaling = 1
; fe_scale = 100
; sim_rate = 60           ; keep simulation at 60; presentation cap is separate

; This subset accepts the PC Extra Options names and decimal units.
; Weather values affect existing rain; they do not force rainy weather.
[Weather]
; GeneralRainAmount = 1
; RoadReflectionAmount = 1
; RainSize = 0.01
; RainIntensity = 0.45
; RainCrossing = 0.02
; RainSpeed = 0.03
; RainGravity = 0.35

[Misc]
; SkipMovies = 0
; SkipNISs = 0
; Selected Extra Options (on by default). They take effect next launch.
; AllowLongerProfileNames: new profile names up to 15 characters (game: 7),
; with the game's own allowed characters. Saves with longer names stay listed
; and loadable when this is 0; only newly created names are limited to 7.
; ShowSpecialVinyls: adds the Special vinyl category after Contest.
; ReplayBlacklistRaces: challenge rivals you have already beaten.
[Menu]
; AllowLongerProfileNames = 1
; ShowSpecialVinyls = 1
; ReplayBlacklistRaces = 1

; SelectableMarkerCount: markers to pick after a rival race, 1 to 6 (game: 2).
; StartingCash: dollars added when a NEW career is created (the PC meaning;
; 10000000 is $10,000,000; 0 is off, the default; up to 100000000). Existing
; careers keep their money. A new career already gets the game's $30,000 and
; the $10,000 Underground 2 bonus (ug2_save_bonus): $40,000 in all.
; F10 shows the same setting in dollars, $100,000 per step.
; If a [Native] key and its PC name both appear, the LAST line wins (logged).
; ForceBlackEdition: Black Edition content (the data is in this install).
[Gameplay]
; EnableMaxPerformanceOnShop = 1
; SelectableMarkerCount = 6
; StartingCash = 0
; ForceBlackEdition = 1
; SkipTrackAnywhere = 1
