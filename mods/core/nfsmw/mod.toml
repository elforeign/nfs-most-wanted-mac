# The game's own settings that the original PC release fixed in code: the
# engine's simulation rate and the rendering resolution. What the community
# widescreen fix (ThirteenAG, MIT) did with binary patches, done here with
# hooks and data writes, because patched code bytes mean nothing to a
# recompiled game. See NOTICE and docs/analysis.md.
id = "core.nfsmw"
name = "Most Wanted native controls, graphics and Extra Options"
version = "2.0.4"
api = 1
game = "80774c2e5d619b4f120b48d4462896fd504c263399d203a238769cffde1d253c"
requires = ["core.hooks >= 1.0.0"]
affects_simulation = true

[plugin]
path = "nfsmw.dylib"

[settings]
look = { type = "int", default = 0, min = 0, max = 2, apply = "renderer", choices = "Definitive|Xbox 360|PC", label = "Look", group = "graphics", help = "Definitive: every finished Remaster improvement on (the best look). Xbox 360: the console look this port rebuilt, without the Remaster features. PC: the original PC game. Your Advanced settings are kept. Some parts (textures, wet roads, wall relief, shadows) change after a restart." }
quality = { type = "int", default = 4, min = 0, max = 4, apply = "renderer", choices = "Low|Medium|High|Ultra|Custom", label = "Detail level", group = "graphics", help = "How detailed the world looks. Higher looks better and works the computer harder." }
antialiasing = { type = "int", default = 0, min = 0, max = 2, apply = "renderer", choices = "Off|2x|4x", label = "Smooth edges (anti-aliasing)", group = "display.quality", help = "Removes jagged, stair-step edges with multisampling (MSAA). Off is fastest and at 4K edges are already small; 2x smooths them for a little GPU time, 4x smoothest for more. Also smooths leaves and fences (Smooth leaves and fences). The detail level does not change it. With HDR on, 4x runs as 2x (the two together stutter at 4K)." }
msaa = { type = "int", default = -1, min = -1, max = 1, apply = "live", label = "Anti-aliasing (old setting)", group = "hidden", help = "The anti-aliasing setting of 1.0 (-1 the game's own, 0 off, 1 4x). Read once and carried over to Smooth edges as Off; then reset to -1." }
spray_fill = { type = "int", default = 1, min = 1, max = 4, apply = "live", label = "Rain spray fill", group = "hidden", help = "Rain spray behind cars drawn from 1/K of the particles, each denser. 1 = as the game (larger values showed no speed gain)." }
settings_version = { type = "int", default = 0, min = 0, max = 100, apply = "live", label = "Settings version", group = "hidden", help = "The last one-time settings migration done (1: Xbox 360 sky 1 -> 2). Not a choice." }
widescreen = { type = "bool", default = true, apply = "restart", label = "Widescreen", group = "display", help = "Fills a wide screen instead of a square-ish picture with black bars. Leave on. Takes effect after a restart." }
remaster_textures = { type = "bool", default = true, apply = "restart", label = "Remaster HD textures", group = "graphics.remaster", help = "Uses the Remaster HD texture pack when one is installed: sharper, more detailed textures made from the originals. 2.0.0 has no pack yet (the Setup app will make it on your Mac in a later release), so the game's own textures show. Restart to apply. Follows Look: Xbox 360 and PC show the original." }
player_mods = { type = "bool", default = true, apply = "restart", label = "Player mods (textures from your Mods folder)", group = "graphics.remaster", help = "Textures you put in the Mods folder next to your saves replace the game's and ours, matched by file name (the launcher's Manage screen has Open mods folder). An empty folder changes nothing. Works in every Look. Restart to apply. What loaded and what did not is listed in Mods/mods-report.txt." }
remaster_a2c = { type = "bool", default = true, apply = "restart", label = "Smooth leaves and fences", group = "graphics.remaster", help = "Smooths the jagged edges of leaves, fences, wires and grass with multisampling (alpha-to-coverage). Needs Smooth edges at 2x or 4x. Restart to apply. Follows Look: Xbox 360 and PC show the original." }
soft_particles = { type = "bool", default = true, apply = "restart", label = "Soft particles", group = "graphics.remaster", help = "Smoke and spray fade out softly where they touch the road, walls and cars, instead of ending in a hard line. Restart to apply. Follows Look: Xbox 360 and PC show the original." }
wet_roads = { type = "int", default = 1, min = 0, max = 2, apply = "restart", choices = "Original|Natural|Xbox 360", label = "Wet roads", group = "graphics.remaster", help = "Natural: wet roads look like real wet asphalt, darker, with an even film, soft puddles and reflections that move with the rain. Xbox 360 adds the console's rain splashes that ripple the reflections, with calmer reflections while it rains. Original keeps the game's bright bands. Restart to apply. Look Xbox 360 uses the Xbox 360 wet road; PC shows the original." }
pbr_facades = { type = "int", default = 1, min = 0, max = 1, apply = "restart", choices = "Original|Relief", label = "Sunlit wall relief", group = "graphics.remaster", help = "Relief: five concrete and stone wall textures get real surface relief in direct sun - joints and pits catch the light on the sun side - with the same overall brightness. A pilot (relief made from the HD textures): it needs the Remaster HD texture pack, which 2.0.0 does not have yet, so for now the walls look original. Shade, night, roads and the mirror are unchanged. Original keeps the game's look. Restart to apply. Follows Look: Xbox 360 and PC show the original." }
road_sheen = { type = "bool", default = true, apply = "restart", label = "Road sun sheen", group = "graphics.remaster", help = "A smooth, natural sheen on the road toward the sun, from measured asphalt values (rough when dry, smoother when wet), instead of the game's golden glitter. Restart to apply. Follows Look: Xbox 360 and PC show the original." }
road_sheen_rain = { type = "int", default = 50, min = 0, max = 100, step = 10, apply = "restart", label = "Road sheen in rain %", group = "graphics.effects", help = "How strong the road sun sheen is on a fully wet road. 100 is as strong as the physics gives; lower keeps rain from looking too shiny. Restart to apply." }
car_reflections = { type = "int", default = 1, min = 0, max = 2, apply = "restart", choices = "Off|Natural|Xbox 360", label = "Car reflections", group = "graphics.remaster", help = "Natural: car paint reflects the sky like a real clear coat, rising smoothly toward the edges, never above a full mirror. Xbox 360: the console paint, with metallic flakes up close, a sharp sun hot spot and glowing bright reflections. Restart to apply. Look Xbox 360 uses the Xbox 360 paint; PC shows the original." }
fe_floor_shadows = { type = "bool", default = true, apply = "restart", label = "Front-end floor shadows", group = "graphics.remaster", help = "In the garage and menus the car also casts a real shadow on the floor from the scene's own light, around the dark patch under it. Restart to apply. Follows Look: Xbox 360 and PC show the original." }
grass = { type = "int", default = 0, min = 0, max = 3, apply = "restart", choices = "Off|Low|Medium|High", label = "Grass", group = "hidden", help = "Retired in 2.0: always off, whatever was saved (no visible gain); the code stays for later." }
natural_water = { type = "int", default = 1, min = 0, max = 2, apply = "restart", choices = "Off|Natural|Xbox 360", label = "Water", group = "graphics.remaster", help = "Water surfaces get moving ripples, a sky reflection that grows at grazing angles and a sharp sun glint. Natural is physically based; Xbox 360 follows the 360 water look. Restart to apply. Look Xbox 360 uses the Xbox 360 water; PC shows the original." }
wall_parallax = { type = "bool", default = true, apply = "restart", label = "Wall depth (parallax)", group = "graphics.remaster", help = "Brick, stone and other normal-mapped walls gain depth: the surface shifts with the view using the height stored in the texture, like the Xbox 360 parallax. Only on textures that store a height. Restart to apply. Follows Look: Xbox 360 and PC show the original." }
natural_glass = { type = "int", default = 1, min = 0, max = 2, apply = "restart", choices = "Off|Natural|Xbox 360", label = "Glass", group = "graphics.remaster", help = "Natural: windows reflect like real glass, little straight on so you see into them, more at a glancing angle. Xbox 360: the console windows, an even grey reflection a little stronger at an angle, with a sharp sun glint. Restart to apply. Look Xbox 360 uses the Xbox 360 glass; PC shows the original." }
soft_shadows = { type = "bool", default = true, apply = "restart", label = "Softer shadows", group = "graphics.remaster", help = "Smooths the jagged edges of sun shadows with a wider filter. Restart to apply. Follows Look: Xbox 360 and PC show the original." }
time_of_day = { type = "int", default = 1, min = 0, max = 1, apply = "restart", choices = "Original (fixed)|Day cycle", label = "Time of day", group = "graphics", help = "Day cycle: the light moves slowly from sunrise to sunset while you play, using the game's own lighting. Original keeps the fixed look. Restart to apply." }
upscale = { type = "int", default = 0, min = 0, max = 2, apply = "restart", choices = "Off|Quality (1.5x)|Performance (2x)", label = "Upscaling (MetalFX) (in development)", group = "display.quality", help = "Draws the 3D picture at a lower resolution and sharpens it up to your screen with Apple's MetalFX; menus and the HUD stay sharp. Quality is close to native; Performance is faster. In development: off until approved. Restart to apply." }
upscale_temporal = { type = "bool", default = false, apply = "restart", label = "Temporal upscaling (in development)", group = "hidden", help = "Not built yet (MetalFX temporal upscaling, planned); always off." }
tod_day_minutes = { type = "int", default = 60, min = 10, max = 240, apply = "restart", label = "Length of a day (minutes)", group = "graphics.cycle", help = "How many minutes of play one sunrise-to-sunset day takes with Day cycle on. Restart to apply." }
weather = { type = "int", default = 1, min = 0, max = 1, apply = "restart", choices = "Original|Weather cycle", label = "Weather", group = "graphics", help = "Weather cycle: a slow natural cycle of clear sky, overcast, rain and roads drying out. Original keeps the game's own weather. Restart to apply." }
weather_cycle_minutes = { type = "int", default = 20, min = 10, max = 240, apply = "restart", label = "Weather cycle length (minutes)", group = "graphics.cycle", help = "Minutes of play for one full weather cycle with Weather cycle on (clear, overcast, rain, drying). Each session starts at a random point of the cycle, so it can already be raining. Restart to apply." }
width = { type = "int", default = 0, min = 0, max = 16384, apply = "restart", label = "Picture width (0 = auto)", group = "display", help = "The width of the picture in pixels. 0 matches your screen automatically, which is best. Restart to apply." }
height = { type = "int", default = 0, min = 0, max = 16384, apply = "restart", label = "Picture height (0 = auto)", group = "display", help = "The height of the picture in pixels. 0 matches your screen automatically, which is best. Restart to apply." }
fov_scaling = { type = "int", default = 1, min = 0, max = 2, choices = "Original|Xbox 360|Exact", apply = "restart", label = "How much you see to the sides", group = "display", help = "Original: the PC game. Xbox 360: a little wider, like the console. Exact: matched to your screen shape. Restart to apply." }
fe_scale = { type = "int", default = 100, min = 50, max = 150, apply = "restart", label = "Menu size %", group = "display", help = "Makes the game's menus bigger or smaller. 100 is normal. Restart to apply." }
hdr_output = { type = "bool", default = false, apply = "live", label = "HDR (for HDR TVs)", group = "display.hdr", help = "On an HDR TV, lets bright things like the sun, lights and chrome shine brighter than normal white; everything else looks as it does with HDR off. The TV switches to its HDR mode. Leave off on a normal screen. With HDR on, Smooth edges at 4x runs as 2x (the two together stutter at 4K)." }
hdr_highlights = { type = "int", default = 60, min = 0, max = 100, step = 10, apply = "live", label = "HDR: how bright highlights get %", group = "display.hdr", help = "Only with HDR on. How much brighter the brightest things get. Higher is punchier." }
hdr_refresh_60 = { type = "bool", default = true, apply = "live", label = "HDR: run at 60 Hz", group = "display.hdr", help = "Only with HDR on. Keeps the TV at 60 Hz, which avoids sparkles on some TVs. Turn off if your TV is fine at 120 Hz." }
appearance = { type = "int", default = 0, min = 0, max = 3, apply = "renderer", choices = "Definitive (default)||PC - Original (textures at next launch)|Definitive - Custom", label = "Overall look", group = "hidden", help = "Definitive: the console-style look this port is built around. PC - Original: the PC game exactly as it was. Custom: Definitive with your own changes below." }
ssao_strength = { type = "int", default = 100, min = 0, max = 200, step = 10, apply = "live", label = "Ambient occlusion strength %", group = "graphics.effects", help = "How strong the ambient occlusion is. 100 is the tuned look." }
golden_filter = { type = "int", default = 0, min = 0, max = 2, apply = "live", choices = "Auto|On|Off", label = "Golden colour filter", group = "graphics.effects", help = "The warm gold colour grade of the original game. Auto follows the Look: on in Xbox 360 and PC (in PC it is the game's own filter), off in Definitive. On or Off sets it yourself in every Look." }
clean_effects = { type = "bool", default = true, apply = "live", label = "Rebuilt effects", group = "graphics.effects", help = "The rebuilt glow, auto brightness, edge darkening, motion blur, depth of field, sun rays and lamp glow. Off: none of these (the plain picture). The sliders below adjust them." }
sun_rays = { type = "bool", default = true, apply = "live", label = "Sun rays", group = "graphics.remaster", help = "Soft rays and glare around the sun when it is in view, on clear days. Uses the new rebuilt effects. Follows Look: Xbox 360 and PC show the original." }
sun_rays_strength = { type = "int", default = 100, min = 0, max = 200, step = 10, apply = "live", label = "Sun rays strength %", group = "graphics.effects", help = "How strong the sun rays and glare are. 100 is the tuned look." }
atmosphere = { type = "bool", default = false, apply = "restart", label = "Haze and low fog (in development)", group = "graphics.remaster", help = "Distant things fade into a soft haze, lighter and bluer far away, warm and bright toward the sun; at dawn and dusk a low mist lies over the bay and low ground and hills rise out of it. Uses the game's own sky colours. In development: off until approved. Restart to apply. Follows Look: Xbox 360 and PC show the original." }
atmosphere_strength = { type = "int", default = 100, min = 0, max = 200, step = 10, apply = "live", label = "Haze strength %", group = "graphics.effects", help = "How thick the haze and low fog are. 100 is the tuned look; 0 turns them off." }
lamp_glow = { type = "bool", default = true, apply = "live", label = "Lamp glow", group = "graphics.remaster", help = "A soft glow in the air around nearby lamps, where it is dark (tunnels, night). Needs Light pools from lamps. Follows Look: Xbox 360 and PC show the original." }
ssao = { type = "bool", default = true, apply = "live", label = "Ambient occlusion", group = "graphics.remaster", help = "Soft contact shadows where surfaces meet: under cars, in corners, kerbs and doorways. Uses the new rebuilt effects. Follows Look: Xbox 360 and PC show the original." }
vehicle_lights = { type = "bool", default = false, apply = "live", label = "Vehicle lights light the world (in development)", group = "graphics.remaster", help = "Headlights and police light bars light the road and walls around them, mostly in tunnels and at dusk. Needs Light pools from lamps. In development: off until approved. Follows Look: Xbox 360 and PC show the original." }
lamp_glow_strength = { type = "int", default = 100, min = 0, max = 200, step = 10, apply = "live", label = "Lamp glow strength %", group = "graphics.effects", help = "How strong the lamp glow is. 100 is the tuned look." }
hybrid_exposure = { type = "int", default = 50, min = 0, max = 100, step = 10, apply = "live", label = "Auto brightness %", group = "graphics.effects", help = "Like your eyes adjusting: tunnels get a bit brighter and bright daylight a bit darker. 0 turns it off." }
hybrid_vignette = { type = "int", default = 0, min = 0, max = 100, step = 25, apply = "live", label = "Darker screen edges %", group = "graphics.effects", help = "Gently darkens the corners of the picture, like a camera lens. 0 is off." }
hybrid_shadows = { type = "int", default = 0, min = 0, max = 100, step = 10, apply = "live", label = "Brighter shadows %", group = "graphics.effects", help = "Lifts the darkest parts of the picture so you can see detail in shadows. Black stays black. 0 is off." }
motion_blur = { type = "bool", default = true, apply = "live", label = "Motion blur", group = "graphics.effects", help = "The picture streaks at the edges of the screen when you drive fast, for a sense of speed. The centre stays sharp." }
motion_blur_strength = { type = "int", default = 10, min = 5, max = 100, step = 5, apply = "live", label = "Motion blur strength %", group = "graphics.effects", help = "How strong the speed streaks are. 100 is the console's strength. Lower it if fast driving feels too blurry." }
cinematic_dof = { type = "bool", default = true, apply = "live", label = "Movie-style background blur", group = "graphics.effects", help = "In cut-scenes and race-start camera shots, things the camera is not looking at go soft, like in a film. Never while you drive." }
dof_strength = { type = "int", default = 30, min = 5, max = 100, step = 5, apply = "live", label = "Background blur strength %", group = "graphics.effects", help = "How soft the background gets in cut-scenes. 100 is the console's strength." }
clean_pools = { type = "bool", default = true, apply = "restart", label = "Light pools from lamps", group = "xbox360.pools", help = "Street lamps and tunnel lights cast soft pools of light on the road, walls and terrain. Off: no light pools at all. Restart to apply." }
clean_pools_strength = { type = "int", default = 100, min = 0, max = 200, step = 10, apply = "live", label = "Light pools brightness %", group = "xbox360.pools", help = "How bright the light pools are. 100 is the tuned look, higher is brighter, 0 hides them." }
clean_pools_props = { type = "bool", default = false, apply = "restart", label = "Light pools on tunnel props", group = "xbox360.pools", help = "Adds local lamp lighting to eligible props (tunnel fans, pipes, gantries) in the main view. May increase stutter in busy scenes. Needs Light pools from lamps. Restart to apply." }
lamp_daylight = { type = "bool", default = false, apply = "live", label = "Street lamps off in daylight", group = "xbox360.pools", help = "Outdoor street lamps fade out while the sun is up and come on at dawn and dusk; tunnel lamps stay on. Their glow follows. Needs Light pools from lamps." }
xbox_particles = { type = "bool", default = true, apply = "restart", label = "Sparks and light trails", group = "xbox360.particles", help = "Sparks when you scrape walls, and light trails behind fast cars. Needs the XenonEffects texture pack. Restart to apply." }
denser_smoke = { type = "bool", default = true, apply = "live", label = "Denser tyre smoke", group = "xbox360.particles", help = "More smoke from each tyre when you skid, slide or do a burnout, as on the Xbox 360. Follows Look: Xbox 360 on, PC off." }
stuffpack_smoke = { type = "bool", default = true, apply = "live", label = "Stuff Pack smoke", group = "xbox360.particles", help = "Adds the community Stuff Pack's extra tyre-smoke layers on asphalt: darker and fuller smoke when you skid, slide or spin the wheels. Works together with Denser tyre smoke. Follows Look: Xbox 360 on, PC off." }
lit_smoke = { type = "bool", default = false, apply = "live", label = "Lit smoke and fog (in development)", group = "graphics.effects", help = "Smoke, steam and fog take the sun's light: thin edges glow when you look toward the sun, thick billows are darker underneath, and in shade they stay soft and grey. Road-flare smoke glows red near the flare. Fog fades softly into the road and as you drive through it. In development: off until approved. Follows Look: Xbox 360 and PC show the original." }
dof_scene_depth = { type = "bool", default = true, apply = "live", label = "Blur: use the scene's own depth (advanced)", group = "hidden", help = "Retired from the menu in 2.0: always on (off only lost the blur in some rain frames)." }
mirror_hd = { type = "bool", default = true, apply = "restart", label = "Mirror: sharp HD picture", group = "graphics.mirror", help = "Draws the rear-view mirror in high resolution instead of a blurry low-res picture. Restart to apply." }
mirror_full_scenery = { type = "bool", default = true, apply = "live", label = "Mirror: show all scenery", group = "graphics.mirror", help = "The mirror shows all the buildings and trees behind you, not a cut-down version." }
mirror_shadows = { type = "bool", default = false, apply = "live", label = "Mirror: world shadows", group = "graphics.mirror", help = "Shows shadows of buildings and trees in the mirror. Costs some speed." }
mirror_car_shadows = { type = "bool", default = true, apply = "live", label = "Mirror: car shadows", group = "graphics.mirror", help = "Cars behind you cast shadows in the mirror." }
mirror_lights = { type = "bool", default = true, apply = "live", label = "Mirror: headlights and police lights", group = "graphics.mirror", help = "Shows headlights and police light bars in the mirror." }
mirror_props = { type = "bool", default = true, apply = "live", label = "Mirror: knocked-over objects", group = "graphics.mirror", help = "Cones, signs and debris you knocked over also show in the mirror." }
mirror_look_back = { type = "bool", default = false, apply = "live", label = "Mirror: keep it while looking back", group = "graphics.mirror", help = "Keeps the mirror on screen when you use Look Back." }
mirror_grade = { type = "bool", default = false, apply = "live", label = "Mirror: match the main view (in development)", group = "graphics.mirror", help = "Gives the rear-view mirror the main view's brightness and shadow lift, so it no longer looks flat or too bright. Needs Mirror: keep sky detail. In development: off until approved. Follows Look: Xbox 360 and PC show the original." }
mirror_glass = { type = "int", default = 0, min = 0, max = 100, apply = "live", label = "Mirror: glass (in development)", group = "graphics.mirror", help = "Makes the mirror look like real glass: a slight cool tint, darker edges and a thin highlight along the top. 0 is the original. In development: off until approved. Follows Look: Xbox 360 and PC show the original." }
mirror_neutral_exposure = { type = "bool", default = true, apply = "live", label = "Mirror: keep sky detail", group = "graphics.mirror", help = "Stops the sky in the mirror from washing out to white." }
mirror_msaa = { type = "int", default = 0, min = 0, max = 1, apply = "restart", choices = "Off|4x", label = "Mirror: smooth edges (in development)", group = "graphics.mirror", help = "Smooths the jagged edges in the rear-view mirror with 4x multisampling, like the main picture (and smooths its leaves and fences). In development: off until approved. Restart to apply. Follows Look: Xbox 360 and PC show the original." }
mirror_pools = { type = "bool", default = false, apply = "live", label = "Mirror: light pools (in development)", group = "graphics.mirror", help = "Street lamps light the road and walls in the rear-view mirror too, as in the main picture. In development: off until approved. Follows Look: Xbox 360 and PC show the original." }
mirror_fov = { type = "int", default = 100, min = 80, max = 130, step = 5, apply = "live", label = "Mirror: field of view %", group = "graphics.mirror", help = "How much the rear-view mirror shows. 100 is the original; lower is a flatter, closer glass, higher a wider panoramic mirror." }
mirror_hdr = { type = "bool", default = true, apply = "live", label = "Mirror: HDR brightness", group = "graphics.mirror", help = "With HDR on, bright lights in the mirror shine like the main picture." }
fe_shadows = { type = "bool", default = false, apply = "restart", label = "Front-end car shadow off", group = "xbox360", help = "In the garage and menus the car has no dark ground shadow under it, as on the Xbox 360. Restart to apply." }
rain_amount = { type = "int", default = 100, min = 0, max = 300, apply = "restart", label = "Rain: amount %", group = "graphics.rain", help = "How many raindrops there are. 100 is normal. Restart to apply." }
rain_intensity = { type = "int", default = 45, min = 0, max = 100, apply = "restart", label = "Rain: visibility %", group = "graphics.rain", help = "How visible each raindrop is. Restart to apply." }
rain_reflection = { type = "int", default = 100, min = 0, max = 300, apply = "restart", label = "Rain: wet road shine %", group = "graphics.rain", help = "How shiny and reflective wet roads look. Restart to apply." }
rain_size = { type = "int", default = 100, min = 1, max = 500, apply = "restart", label = "Rain: drop size", group = "graphics.rain", help = "How big the raindrops are. 100 is normal. Restart to apply." }
rain_speed = { type = "int", default = 300, min = 0, max = 1000, apply = "restart", label = "Rain: falling speed", group = "graphics.rain", help = "How fast the rain falls. Restart to apply." }
rain_crossing = { type = "int", default = 200, min = 0, max = 1000, apply = "restart", label = "Rain: sideways drift", group = "graphics.rain", help = "How much the rain drifts sideways. Restart to apply." }
rain_gravity = { type = "int", default = 35, min = 0, max = 100, apply = "restart", label = "Rain: heaviness", group = "graphics.rain", help = "How heavily the rain drops. Restart to apply." }
x360_textures = { type = "bool", default = true, apply = "restart", label = "Xbox 360 textures", group = "xbox360", help = "Uses the sharper Xbox 360 textures for roads, buildings and cars (needs the texture pack). Restart to apply." }
x360_frontend = { type = "bool", default = true, apply = "restart", label = "Xbox 360 front end", group = "xbox360", help = "The Xbox 360 menus, title and loading art and garages from the Xbox 360 Stuff Pack (when Setup added it). Off: the PC front end (and your own game folder's FrontB/GlobalB files, if a mod changed them). Restart to apply." }
x360_sky = { type = "int", default = 2, min = 0, max = 2, apply = "restart", choices = "Original||Xbox 360", label = "Xbox 360 sky", group = "xbox360", help = "Xbox 360: the console sky and clouds, our own version of the console sky shader. Original: the PC sky. Restart to apply." }
splash_xbox = { type = "bool", default = true, apply = "restart", label = "Xbox 360 start screen", group = "xbox360", help = "Shows the Xbox 360 start screen with the EA and HD logos (when the USA videos are installed). Restart to apply." }
x360_exposure = { type = "bool", default = true, apply = "restart", label = "Post-processing (master switch)", group = "hidden", help = "Retired from the menu in 2.0: always on (off also broke the HDR highlight mark)." }
mod_lighting = { type = "bool", default = true, apply = "restart", label = "Remove the golden haze", group = "graphics.engine", help = "Removes the heavy gold/sepia colour, blur and glow that both the PC and Xbox 360 versions have, for a cleaner picture. Off brings back the PC game's gold tint. Restart to apply." }
mod_hq_preset = { type = "bool", default = true, apply = "game_video", label = "Better top detail presets", group = "pc", help = "Makes the game's highest detail presets use this port's higher quality settings." }
preculler = { type = "bool", default = true, apply = "live", label = "Fast scenery hiding (leave on)", group = "graphics.engine", help = "The game's own trick for not drawing what you cannot see. Leave on for speed." }
impact_rumble = { type = "int", default = 100, min = 0, max = 200, apply = "live", label = "Rumble: crashes %", group = "feedback", help = "How hard the controller shakes when you hit something. 0 turns it off." }
