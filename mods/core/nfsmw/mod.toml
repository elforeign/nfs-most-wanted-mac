# The game's own settings that the original PC release fixed in code: the
# engine's simulation rate and the rendering resolution. What the community
# widescreen fix (ThirteenAG, MIT) did with binary patches, done here with
# hooks and data writes, because patched code bytes mean nothing to a
# recompiled game. See NOTICE and docs/analysis.md.
id = "core.nfsmw"
name = "Most Wanted native controls, graphics and Extra Options"
version = "3.0.4"
api = 1
game = "80774c2e5d619b4f120b48d4462896fd504c263399d203a238769cffde1d253c"
requires = ["core.hooks >= 1.0.0"]
affects_simulation = true

[plugin]
path = "nfsmw.dylib"

[settings]
mac_preset = { type = "int", default = 0, min = 0, max = 3, apply = "restart", choices = "Auto (this Mac)|Full|Balanced|Light", label = "Mac preset", group = "graphics", help = "Lowers the picture cost for this Mac. Auto picks by chip and screen. Full: your own settings. Balanced: upscaling Quality, smooth edges 2x max. Light: upscaling Performance; smooth edges, ambient occlusion, softer shadows, lamp glow, denser smoke off. Saved values stay." }
quality = { type = "int", default = 4, min = 0, max = 4, apply = "renderer", choices = "Low|Medium|High|Ultra|Custom", label = "Detail level", group = "graphics", help = "How much detail the game draws: world, cars, shadows and effects (the game's own Video options). Lower levels look plainer and run faster; Custom keeps your own choices from the Video menu. Cost: Low to High by level. Weaker Mac: try the Mac preset or Upscaling first." }
time_of_day = { type = "int", default = 1, min = 0, max = 1, apply = "restart", choices = "Original (fixed)|Day cycle", label = "Time of day", group = "graphics", help = "Day cycle: the light moves slowly from sunrise to sunset while you play, with the game's own lighting. Original keeps the game's fixed light. Cost: Low." }
weather = { type = "int", default = 1, min = 0, max = 1, apply = "restart", choices = "Original|Weather cycle", label = "Weather", group = "graphics", help = "Weather cycle: clear sky, overcast, rain and drying roads come and go slowly while you play. Original keeps the game's own weather. Cost: rain adds 1.5-2.6 ms of main-thread time while the road is wet." }
golden_grade = { type = "int", default = 0, min = 0, max = 1, apply = "live", choices = "Off|On", label = "Golden colour filter", group = "graphics", help = "Gives the picture the warm gold colour grade of the original game, as on the Xbox 360. Off shows natural colours (the default). Cost: Low." }
motion_blur = { type = "bool", default = true, apply = "live", label = "Motion blur", group = "graphics", help = "The edges of the screen streak when you drive fast, for a sense of speed; the centre stays sharp. Off keeps the whole picture sharp. Needs Picture effects on. Cost: Low." }
cinematic_dof = { type = "bool", default = true, apply = "live", label = "Movie-style background blur", group = "graphics", help = "In cut-scenes and race-start camera shots, what the camera is not looking at goes soft, like in a film. Never while you drive. Off keeps everything sharp. Needs Picture effects on. Cost: Low." }
ssao = { type = "bool", default = true, apply = "live", label = "Ambient occlusion", group = "graphics.lighting", help = "Darkens corners, under cars and where walls meet the road, so objects sit in the scene instead of floating. Off looks flatter. Needs Picture effects on. Cost: about +0.7 ms GPU at 4K. Weaker Mac: off (the Light preset does this)." }
ssao_strength = { type = "int", default = 100, min = 0, max = 200, step = 10, apply = "live", label = "Ambient occlusion strength %", group = "graphics.lighting", help = "How dark the ambient occlusion shading is. 100 is the tuned look; lower is lighter, higher is darker." }
soft_shadows = { type = "bool", default = true, apply = "restart", label = "Softer shadows", group = "graphics.lighting", help = "Sun shadows get soft, smooth edges instead of jagged, stair-stepped ones. Off shows the harder original edges. Cost: Medium. Weaker Mac: off (the Light preset does this)." }
sun_rays = { type = "bool", default = true, apply = "live", label = "Sun rays", group = "graphics.lighting", help = "Soft rays and glare around the sun when it is in view on clear days. Off: no rays or glare. Needs Picture effects on. Cost: Low." }
sun_rays_strength = { type = "int", default = 100, min = 0, max = 200, step = 10, apply = "live", label = "Sun rays strength %", group = "graphics.lighting", help = "How strong the sun rays and glare are. 100 is the tuned look; lower is subtler, higher brighter." }
lamp_glow = { type = "bool", default = true, apply = "live", label = "Lamp glow", group = "graphics.lighting", help = "A soft glow hangs in the air around nearby lamps where it is dark (tunnels, night). Off: lamps light the road but the air stays clear. Needs Light pools from lamps. Cost: Low. Weaker Mac: off (the Light preset does this)." }
lamp_glow_strength = { type = "int", default = 100, min = 0, max = 200, step = 10, apply = "live", label = "Lamp glow strength %", group = "graphics.lighting", help = "How strong the glow around lamps is. 100 is the tuned look; lower is subtler, higher brighter." }
vehicle_lights = { type = "bool", default = false, apply = "live", label = "Vehicle lights light the world (in development)", group = "graphics.lighting", help = "Headlights and police light bars light up the road and walls around them, mostly in tunnels and at dusk. Off: car lights glow but light nothing around them. Needs Light pools from lamps. Cost: Low. In development: off until approved." }
clean_pools = { type = "bool", default = true, apply = "restart", label = "Light pools from lamps", group = "graphics.lighting", help = "Street lamps and tunnel lights cast soft pools of light on the road, walls and terrain. Off: no light pools at all, so night streets look darker and flatter. Cost: about +0.4 ms GPU at 4K." }
clean_pools_strength = { type = "int", default = 100, min = 0, max = 200, step = 10, apply = "live", label = "Light pools brightness %", group = "graphics.lighting", help = "How bright the light pools from lamps are. 100 is the tuned look; higher is brighter, 0 hides them." }
fe_floor_shadows = { type = "bool", default = true, apply = "restart", label = "Garage floor shadows", group = "graphics.lighting", help = "In the garage and menus the car also casts a real shadow on the floor from the scene's light, around the dark patch under it. Off: only the dark patch. Cost: Low (menus only)." }
fe_shadows = { type = "bool", default = false, apply = "restart", label = "Hide the garage car shadow", group = "graphics.lighting", help = "On: in the garage and menus the car has no dark ground patch under it, as on the Xbox 360. Off (the default) keeps the PC game's dark patch." }
mod_lighting = { type = "bool", default = true, apply = "restart", label = "Clear picture (no PC haze)", group = "graphics.lighting", help = "Removes the heavy gold-sepia tint, blur and glow that both the PC and Xbox 360 versions lay over the picture, for a clean, clear image. Off brings back the PC game's gold haze. Cost: Low." }
remaster_textures = { type = "bool", default = true, apply = "restart", label = "Remaster HD textures", group = "graphics.surfaces", help = "Sharper, more detailed textures made on your Mac from your own game's originals, on roads, buildings and cars. Off shows the original, softer textures. Needs Make HD textures in Setup (run Setup again to add them later). Cost: Low (uses more memory)." }
material_sets = { type = "int", default = 1, min = 0, max = 1, apply = "restart", choices = "Off|On", label = "Road surface detail", group = "graphics.surfaces", help = "Dry roads show real surface detail: grain and cracks in low sun, a tight sun sheen on smooth patches and a wide one on rough asphalt. Off: flatter roads. Needs HD textures and Road sun sheen on, and a Mac with 16 GB of memory or more. Cost: Low." }
pbr_facades = { type = "int", default = 1, min = 0, max = 1, apply = "restart", choices = "Original|Relief", label = "Sunlit wall relief", group = "graphics.surfaces", help = "Relief: five concrete and stone wall textures get real depth in direct sun; joints and pits catch the light on the sunny side. Original keeps flat walls. Shade, night, roads and the mirror are unchanged. Needs HD textures on. Cost: Low." }
wall_parallax = { type = "bool", default = true, apply = "restart", label = "Wall depth (parallax)", group = "graphics.surfaces", help = "Brick, stone and similar walls gain depth: the surface shifts as you move past, as on the Xbox 360. Off: flat walls. Only on textures that carry height detail. Cost: Low." }
wall_sheen = { type = "int", default = 1, min = 0, max = 1, apply = "restart", choices = "Off|On", label = "Wall sun sheen", group = "graphics.surfaces", help = "Sunlit walls and metal get a soft sun highlight: tight on smooth stone and metal, wide and faint on brick and concrete. Shade, night, roads and the mirror are unchanged. Needs Road surface detail on. Cost: Low." }
road_sheen = { type = "bool", default = true, apply = "restart", label = "Road sun sheen", group = "graphics.surfaces", help = "The road shines naturally toward the sun, rough when dry and smoother when wet. Off brings back the game's golden glitter on the asphalt. Cost: Low." }
road_sheen_rain = { type = "int", default = 50, min = 0, max = 100, step = 10, apply = "restart", label = "Road sheen in rain %", group = "graphics.surfaces", help = "How strong the road sun sheen is on a fully wet road. 100 is as strong as real wet asphalt; lower keeps rain from looking too shiny. 50 is the tuned look." }
wet_roads = { type = "int", default = 1, min = 0, max = 2, apply = "restart", choices = "Original|Natural|Xbox 360", label = "Wet roads", group = "graphics.surfaces", help = "Natural (the default): wet roads look like real wet asphalt, darker, with soft puddles and reflections that move with the rain. Xbox 360 adds the console's splashes that ripple the reflections. Original keeps the game's bright bands. Cost: Low." }
car_reflections = { type = "int", default = 1, min = 0, max = 2, apply = "restart", choices = "Off|Natural|Xbox 360", label = "Car reflections", group = "graphics.surfaces", help = "Natural (the default): car paint reflects the sky like a real clear coat, stronger toward the edges. Xbox 360: the console paint, with metallic flakes up close, a sharp sun hot spot and glowing reflections. Off: the PC game's paint. Cost: Low." }
natural_glass = { type = "int", default = 1, min = 0, max = 2, apply = "restart", choices = "Off|Natural|Xbox 360", label = "Glass", group = "graphics.surfaces", help = "Natural (the default): windows reflect like real glass, little straight on so you see inside, more at a glancing angle. Xbox 360: an even grey reflection with a sharp sun glint. Off: the PC game's windows. Cost: Low." }
natural_water = { type = "int", default = 1, min = 0, max = 2, apply = "restart", choices = "Off|Natural|Xbox 360", label = "Water", group = "graphics.surfaces", help = "Water gets moving ripples, a sky reflection that grows at low angles and a sharp sun glint. Natural (the default) looks like real water; Xbox 360 follows the console's water. Off: the PC game's water. Cost: Low." }
ssr = { type = "bool", default = false, apply = "restart", label = "Screen-space reflections (in development)", group = "graphics.surfaces", help = "Car paint, chrome, windows and water also reflect what is on screen around them, such as buildings and other cars. Off: the normal reflections only. Cost: Medium. In development: off until approved." }
ssr_strength = { type = "int", default = 100, min = 0, max = 200, step = 10, apply = "restart", label = "Reflections strength %", group = "graphics.surfaces", help = "How strong the screen-space reflections are. 100 is the tuned look; lower is subtler." }
remaster_a2c = { type = "bool", default = true, apply = "restart", label = "Smooth leaves and fences", group = "graphics.surfaces", help = "Smooths the jagged edges of leaves, fences, wires and grass. Off leaves them grainy. Works only with Smooth edges at 2x or 4x. Cost: Low (part of Smooth edges)." }
x360_textures = { type = "bool", default = true, apply = "restart", label = "Xbox 360 textures", group = "graphics.surfaces", help = "Uses the sharper Xbox 360 textures for roads, buildings and cars. Off: the PC textures, softer in places. Needs the texture pack. Cost: Low." }
clean_effects = { type = "bool", default = true, apply = "live", label = "Picture effects (glow, blur, sun rays)", group = "graphics.camera", help = "The glow, auto brightness, edge darkening, motion blur, background blur, sun rays and lamp glow. Off: none of these, a plain and flatter picture. The sliders below tune them. Cost: about +1.9 ms GPU at 4K." }
motion_blur_strength = { type = "int", default = 10, min = 5, max = 100, step = 5, apply = "live", label = "Motion blur strength %", group = "graphics.camera", help = "How strong the speed streaks are. 100 is the Xbox 360's strength; lower it if fast driving feels too blurry." }
dof_strength = { type = "int", default = 30, min = 5, max = 100, step = 5, apply = "live", label = "Background blur strength %", group = "graphics.camera", help = "How soft the background gets in cut-scenes. 100 is the Xbox 360's strength; lower keeps more in focus." }
atmosphere = { type = "bool", default = false, apply = "restart", label = "Haze and low fog (in development)", group = "graphics.camera", help = "Distant things fade into a soft haze, bluer far away and warm toward the sun; at dawn and dusk a low mist lies over the bay and low ground. Off: clear air to the horizon. Cost: Low. In development: off until approved." }
atmosphere_strength = { type = "int", default = 100, min = 0, max = 200, step = 10, apply = "live", label = "Haze strength %", group = "graphics.camera", help = "How thick the haze and low fog are. 100 is the tuned look; 0 turns them off." }
scenery_fade = { type = "int", default = 1, min = 0, max = 1, apply = "restart", choices = "Off|On", label = "Scenery fade-in", group = "graphics.camera", help = "Buildings, trees and fences fade in over about 0.3 s instead of popping into view. You notice it most at speed on long straights. Off: the original pop-in. Cost: +0.2-0.8 ms GPU at 4K. Fine on every Mac." }
tod_day_minutes = { type = "int", default = 60, min = 10, max = 240, apply = "restart", label = "Length of a day (minutes)", group = "graphics.weather", help = "How many minutes of play one sunrise-to-sunset day takes with Day cycle on. Lower is a faster sky; higher a slower one." }
weather_cycle_minutes = { type = "int", default = 20, min = 10, max = 240, apply = "restart", label = "Weather cycle length (minutes)", group = "graphics.weather", help = "Minutes of play for one full weather cycle with Weather cycle on: clear, overcast, rain, drying. Each session starts at a random point, so it can already be raining." }
rain_drops = { type = "int", default = 1, min = 0, max = 1, apply = "restart", choices = "Original|Xbox 360", label = "Rain: drops on the screen", group = "graphics.weather", help = "Xbox 360 (the default): soft drops on the camera lens that bend and shade the picture behind them, in four shapes. Original: the PC game's bright round drop. Cost: about +0.5 ms while it rains." }
x360_sky = { type = "int", default = 2, min = 0, max = 2, apply = "restart", choices = "Original||Xbox 360", label = "Xbox 360 sky", group = "graphics.weather", help = "Xbox 360 (the default): the console's sky and clouds, rebuilt for the Mac. Original: the PC game's sky. Cost: Low." }
always_rain = { type = "bool", default = false, apply = "restart", label = "Always rain", group = "graphics.weather", help = "Makes it rain all the time, on every road. Off: rain comes only with the weather. From Extra Options. Cost: rain adds 1.5-2.6 ms of main-thread time while the road is wet." }
soft_particles = { type = "bool", default = true, apply = "restart", label = "Soft particles", group = "graphics.particles", help = "Smoke and spray fade out softly where they touch the road, walls and cars, instead of ending in a hard line. Off shows the hard edges. Cost: about +0.7 ms GPU at 4K in a burnout." }
xbox_particles = { type = "bool", default = true, apply = "restart", label = "Sparks and light trails", group = "graphics.particles", help = "Sparks fly when you scrape walls, and fast cars leave light trails. Off: no sparks or trails. Needs the XenonEffects texture pack. Cost: Low." }
denser_smoke = { type = "bool", default = true, apply = "live", label = "Denser tyre smoke", group = "graphics.particles", help = "More smoke from each tyre when you skid, slide or do a burnout, as on the Xbox 360. Off: the thinner PC smoke. Cost: Low to Medium in a burnout. Weaker Mac: off (the Light preset does this)." }
stuffpack_smoke = { type = "bool", default = true, apply = "live", label = "Stuff Pack smoke", group = "graphics.particles", help = "Adds extra tyre-smoke layers on asphalt from the community Stuff Pack: darker, fuller smoke when you skid, slide or spin the wheels. Works with Denser tyre smoke. Cost: Low." }
lit_smoke = { type = "bool", default = false, apply = "live", label = "Lit smoke and fog (in development)", group = "graphics.particles", help = "Smoke, steam and fog take the sun's light: thin edges glow toward the sun, thick billows are darker underneath, and road-flare smoke glows red. Off: evenly lit smoke. Cost: Low. In development: off until approved." }
mirror_hd = { type = "bool", default = true, apply = "restart", label = "Mirror: sharp HD picture", group = "graphics.mirror", help = "Draws the rear-view mirror at high resolution instead of a blurry low-resolution picture. Off: the original blurry mirror. Cost: about 0 ms." }
mirror_full_scenery = { type = "bool", default = true, apply = "live", label = "Mirror: show all scenery", group = "graphics.mirror", help = "The mirror shows all the buildings and trees behind you. Off: a cut-down version. Cost: about 0 ms." }
mirror_shadows = { type = "bool", default = false, apply = "live", label = "Mirror: world shadows", group = "graphics.mirror", help = "Draws building and tree shadows in the rear-view mirror too. Subtle, as the mirror is small. Cost: about 1.4 ms of main-thread time, the most expensive mirror row. Weaker Mac: off." }
mirror_car_shadows = { type = "bool", default = true, apply = "live", label = "Mirror: car shadows", group = "graphics.mirror", help = "Cars behind you cast shadows in the mirror. Off: cars without shadows in the mirror. Cost: about 0 ms." }
mirror_lights = { type = "bool", default = true, apply = "live", label = "Mirror: headlights and police lights", group = "graphics.mirror", help = "Headlights and police light bars show in the mirror, so you see who is coming at night. Cost: about 0 ms." }
mirror_props = { type = "bool", default = true, apply = "live", label = "Mirror: knocked-over objects", group = "graphics.mirror", help = "Cones, signs and debris you knocked over also show in the mirror. Cost: about 0 ms." }
mirror_look_back = { type = "bool", default = false, apply = "live", label = "Mirror: keep it while looking back", group = "graphics.mirror", help = "Keeps the rear-view mirror on screen while you use Look Back. Off hides it while you look back." }
mirror_neutral_exposure = { type = "bool", default = true, apply = "live", label = "Mirror: keep sky detail", group = "graphics.mirror", help = "Stops the sky in the mirror from washing out to white, so clouds and sky colour stay visible. Cost: about 0 ms." }
mirror_fov = { type = "int", default = 100, min = 80, max = 130, step = 5, apply = "live", label = "Mirror: field of view %", group = "graphics.mirror", help = "How much the rear-view mirror shows. 100 is the original; lower is a closer, flatter view, higher a wider panoramic mirror." }
mirror_hdr = { type = "bool", default = true, apply = "live", label = "Mirror: HDR brightness", group = "graphics.mirror", help = "With HDR on, bright lights in the mirror shine as in the main picture. Off: the mirror stays at normal brightness. Cost: about 0 ms." }
preculler = { type = "bool", default = true, apply = "live", label = "Skip unseen scenery (leave on)", group = "graphics.engine", help = "Skips drawing scenery you cannot see, the game's own speed trick. Nothing changes on screen. Leave on: off costs about 1.3 ms of main-thread time." }
widescreen = { type = "bool", default = true, apply = "restart", label = "Widescreen", group = "display", help = "Fills a wide screen with the picture instead of a narrower picture with black bars at the sides. Leave on." }
width = { type = "int", default = 0, min = 0, max = 16384, apply = "restart", label = "Picture width (0 = auto)", group = "display", help = "The width of the 3D picture in pixels. 0 matches your screen, which is best. Weaker Mac: keep 0 and use Upscaling instead." }
height = { type = "int", default = 0, min = 0, max = 16384, apply = "restart", label = "Picture height (0 = auto)", group = "display", help = "The height of the 3D picture in pixels. 0 matches your screen, which is best. Weaker Mac: keep 0 and use Upscaling instead." }
fov_scaling = { type = "int", default = 1, min = 0, max = 2, choices = "Original|Xbox 360|Exact", apply = "restart", label = "How much you see to the sides", group = "display", help = "How much of the road you see to the sides. Xbox 360 (the default): a little wider, like the console. Original: the PC game's view. Exact: matched to your screen's shape." }
fe_scale = { type = "int", default = 100, min = 50, max = 150, apply = "restart", label = "Menu size %", group = "display", help = "Makes the game's menus bigger or smaller. 100 is normal; raise it if menu text is hard to read on a TV." }
brightness = { type = "int", default = 0, min = -5, max = 5, apply = "live", label = "Brightness", group = "display", help = "Makes the shadows and mid-tones a little lighter (+) or darker (-), like a TV's brightness; black and white stay as they are, and the menus are not changed. 0 shows the picture as it is. Cost: none." }
antialiasing = { type = "int", default = 0, min = 0, max = 2, apply = "renderer", choices = "Off|2x|4x", label = "Smooth edges (anti-aliasing)", group = "display.quality", help = "Smooths jagged edges on wires, fences and car outlines. 2x removes most stair-steps; 4x nearly all, at a distance too. Cost: 2x +1.5 ms, 4x +3.6 ms GPU at 4K; with HDR, 4x runs as 2x. Weaker Mac: Off, and use Upscaling instead." }
upscale = { type = "int", default = 0, min = 0, max = 2, apply = "restart", choices = "Off|Quality (1.5x)|Performance (2x)", label = "Upscaling (MetalFX) (in development)", group = "display.quality", help = "Draws the 3D picture at a lower resolution and sharpens it up to your screen with Apple MetalFX; menus and HUD stay sharp. Quality looks close to full resolution; Performance is faster and a little softer. Cost: saves GPU time. Weaker Mac: Performance. In development: off until approved." }
hdr_output = { type = "bool", default = false, apply = "live", label = "HDR (for HDR TVs)", group = "display.hdr", help = "Sends a high-dynamic-range picture: brighter sun, headlights and reflections, deeper darks. Needs an HDR display; wrong on an SDR one (washed out). Cost: +1.6-1.9 ms GPU at 4K. Pair with 2x smooth edges at most; 4x runs as 2x." }
hdr_highlights = { type = "int", default = 60, min = 0, max = 100, step = 10, apply = "live", label = "HDR: how bright highlights get %", group = "display.hdr", help = "Only with HDR on. How much brighter than white the brightest things get, like the sun and headlights. Higher is punchier, lower calmer." }
hdr_refresh_60 = { type = "bool", default = true, apply = "live", label = "HDR: run at 60 Hz", group = "display.hdr", help = "Only with HDR on. Keeps the TV at 60 Hz, which avoids sparkles on some TVs. Turn off if your TV looks fine at 120 Hz." }
surround_audio = { type = "bool", default = false, apply = "next_screen", label = "5.1 surround sound", group = "audio", help = "Sends 5.1 surround sound to your speakers or receiver. Off: stereo." }
mute_in_background = { type = "bool", default = false, apply = "live", label = "Mute in background", group = "audio", help = "Silences the game while its window is not in front (another app is active), and brings the sound back when you return. Off keeps the sound playing. Cost: none." }
audio_dolby_digital = { type = "bool", default = true, apply = "next_screen", label = "Dolby Digital (for TVs and receivers)", group = "audio", help = "Sends surround as Dolby Digital over HDMI to a TV or receiver. Turn off if 5.1 sound comes out of the wrong speakers." }
audio_center_lfe_swap = { type = "bool", default = false, apply = "next_screen", label = "Fix swapped centre/subwoofer", group = "audio", help = "Swaps the centre and subwoofer channels, for setups where voices come from the subwoofer." }
hud_hd = { type = "bool", default = true, apply = "restart", label = "HD HUD", group = "ui", help = "The race HUD, minimap and fonts in sharp HD, made from the game's own art, with the gauges and icons redrawn as crisp outlines. Off shows the original, softer HUD. Cost: Low." }
hud_on_look_back = { type = "bool", default = false, apply = "restart", label = "Keep the HUD when looking back", group = "ui", help = "The HUD stays on screen while you look back, as in Underground 2. Off hides it while you look back. From Extra Options." }
show_nonpursuit_cops = { type = "bool", default = false, apply = "restart", label = "Minimap: show all police", group = "ui", help = "The minimap also shows police cars that are not chasing you. Off shows only your pursuers. From Extra Options." }
percent_1lap = { type = "bool", default = true, apply = "restart", label = "One-lap races show percent", group = "ui", help = "One-lap races show COMPLETED percent instead of LAP 1/1. From Extra Options." }
world_map_anywhere = { type = "bool", default = true, apply = "restart", label = "World Map in races", group = "ui", help = "Lets you open the World Map from the pause menu during races and pursuits too, not only while roaming. From Extra Options." }
discord_status = { type = "bool", default = false, apply = "live", label = "Discord status", group = "ui", help = "Shows on your Discord profile that you are playing, whether you are driving or in the menus, and your time played, for your friends to see, while the Discord app is open. Off (the default) shares nothing; switching off clears it at once. Cost: none." }
x360_frontend = { type = "bool", default = true, apply = "restart", label = "Xbox 360 front end", group = "ui.menus", help = "The Xbox 360 menus, title and loading art and garages from the Xbox 360 Stuff Pack, when Setup added it. Off: the PC menus (and any menu mod in your game folder)." }
splash_xbox = { type = "bool", default = false, apply = "restart", label = "Xbox 360 start screen", group = "ui.menus", help = "Shows the Xbox 360 start screen (dark, the logo to the right). Off: the PC start screen, the BMW picture with the EA and HD logos." }
movie_fit = { type = "bool", default = true, apply = "next_screen", label = "Fit movies to the screen", group = "ui.menus", help = "Shows the full widescreen movies without cutting off the sides." }
skip_movies = { type = "bool", default = false , apply = "restart", label = "Skip intro movies", group = "ui.menus", help = "Skips the movies at start-up and in the story (logos and story videos)." }
skip_nis = { type = "bool", default = false , apply = "restart", label = "Skip cut-scenes", group = "ui.menus", help = "Skips the in-game cut-scenes." }
subtitles = { type = "bool", default = false, apply = "restart", label = "Subtitles", group = "ui.menus", help = "Shows English subtitles in the story scenes. From Extra Options." }
long_profile_names = { type = "bool", default = true, apply = "restart", label = "Longer profile names", group = "ui.menus", help = "Allows profile names up to 15 characters." }
pause_in_menu = { type = "bool", default = true, apply = "live", label = "Settings menu pauses the game", group = "game", help = "The game stops while this settings menu (F10) is open: race clock, traffic, police and music wait, and carry on when you close it. Off keeps the game running behind the menu. Cost: none." }
black_edition = { type = "bool", default = true, apply = "restart", label = "Black Edition extras", group = "game", help = "Adds the Black Edition cars, races and content." }
replay_blacklist = { type = "bool", default = true, apply = "restart", label = "Race beaten Blacklist rivals again", group = "game", help = "Lets you race Blacklist rivals you already beat." }
special_vinyls = { type = "bool", default = true, apply = "restart", label = "Special vinyls", group = "game", help = "Adds the special vinyls category in the paint shop." }
max_perf_shop = { type = "bool", default = true, apply = "restart", label = "Max performance button", group = "game", help = "Adds a button in the shop that buys all performance upgrades at once." }
marker_count = { type = "int", default = 6, min = 1, max = 6, apply = "restart", label = "Rival rewards to pick (of 6)", group = "game", help = "How many reward markers you pick after beating a Blacklist rival. 6 is the most." }
helicopter_bounty = { type = "bool", default = true, apply = "restart", label = "Helicopter takedown bounty", group = "game", help = "Taking down a police helicopter gives a 100,000 bounty and an announcement. A community fix; the Xbox 360 does not have it." }
ug2_save_bonus = { type = "bool", default = true, apply = "new_career", label = "New career: $10,000 bonus", group = "game", help = "A new career starts with the $10,000 bonus the game gives for an Underground 2 save." }
starting_cash = { type = "int", default = 0, min = 0, max = 100000000, step = 100000, unit = "$", apply = "new_career", label = "New career: extra starting cash", group = "game", help = "Extra money at the start of a new career. 0 is the normal start." }
heat_level_override = { type = "bool", default = false, apply = "next_screen", label = "Choose police heat levels", group = "game.police", help = "On: police heat stays between the lowest and highest levels below. Heat 6 to 10 send up to 8 police cars, like heat 5." }
heat_level_min = { type = "int", default = 1, min = 1, max = 10, apply = "next_screen", label = "Heat level: lowest", group = "game.police", help = "The lowest police heat level when Choose police heat levels is on." }
heat_level_max = { type = "int", default = 10, min = 1, max = 10, apply = "next_screen", label = "Heat level: highest", group = "game.police", help = "The highest police heat level when Choose police heat levels is on." }
no_catch_up = { type = "bool", default = false, apply = "restart", label = "No catch-up", group = "game.police", help = "Turns off the opponents' catch-up, so racers no longer slow down or speed up to stay near you. This changes how races play. From Extra Options." }
unlock_all = { type = "bool", default = false, apply = "restart", label = "Unlock everything", group = "game.unlocks", help = "Unlocks all cars, parts, events and areas, and lets you play hidden tracks. From Extra Options." }
remove_neon_barriers = { type = "bool", default = false, apply = "restart", label = "Remove glowing barriers", group = "game.unlocks", help = "Removes the glowing barriers that close off locked areas and routes. From Extra Options." }
remove_old_bridge_barrier = { type = "bool", default = false, apply = "restart", label = "Open the Old Bridge", group = "game.unlocks", help = "Removes the barrier that closes the road to the Old Bridge. From Extra Options." }
hot_positions = { type = "bool", default = false, apply = "restart", label = "Save and load positions", group = "game.unlocks", help = "While driving, Left Shift plus 1 to 5 saves where you are and Left Ctrl plus 1 to 5 takes you back there. From Extra Options." }
skip_track_anywhere = { type = "bool", default = true, apply = "restart", label = "Skip music track while driving", group = "game.unlocks", help = "The skip-track key works while driving too, not only in the menus. From Extra Options." }
zero_bounty_fix = { type = "bool", default = true, apply = "restart", label = "Fix: bounty at heat 10", group = "game.fixes", help = "Fixes the zero bounty for takedowns at heat 10 and the over-long combo timer. From Extra Options." }
dday_fix = { type = "bool", default = true, apply = "restart", label = "Fix: prologue forced again", group = "game.fixes", help = "Stops the game sending a career that is already under way back to the prologue. From Extra Options." }
busted_nis_fix = { type = "bool", default = true, apply = "restart", label = "Fix: unused Busted scenes", group = "game.fixes", help = "Lets the Busted cut-scenes for heat 2 and 3 play, as intended. From Extra Options." }
player_mods = { type = "bool", default = true, apply = "restart", label = "Player mods (textures from your Mods folder)", group = "mods", help = "Textures you put in the Mods folder next to your saves replace the game's and ours, matched by file name (Manage in the launcher has Open mods folder). An empty folder changes nothing. A report in the Mods folder lists what loaded." }
data_mods = { type = "bool", default = true, apply = "restart", label = "Data mods (changed game files)", group = "mods", help = "Game files in your DataMods folder (beside Mods) replace the game's own while it runs: cars, tracks, menus, sounds, data. Your game folder is never changed and no program files are used. A mod that changes the career data can change which careers load; your saves are backed up." }
position_log = { type = "bool", default = false, apply = "live", label = "Log my position", group = "diagnostics", help = "Writes where you are to the log, so you can report a spot that needs fixing." }
memory_log = { type = "bool", default = true, apply = "live", label = "Log memory use", group = "diagnostics", help = "Writes the game's memory use to the log once a minute." }
input_trace = { type = "bool", default = false, apply = "live", label = "Log controller input", group = "diagnostics", help = "Writes controller and keyboard input to the log, for bug reports." }
ps2_controls = { type = "bool", default = true, apply = "live", label = "PlayStation-style buttons", group = "controls", help = "The default controller layout: Cross accelerates and Triangle goes back, like the PlayStation version. Change any driving button in the game's Options, Controls." }
trigger_pedals = { type = "bool", default = false, apply = "live", label = "Triggers as pedals", group = "controls", help = "R2 accelerates and L2 brakes, both analog, like most modern racing games. Off: the face-button layout." }
stick_deadzone = { type = "int", default = 8, min = 0, max = 30, apply = "live", label = "Stick deadzone", group = "controls", help = "How far a stick must move before the game sees it, in percent. Raise it if the car steers by itself with the stick at rest; lower it for a quicker response. 8 is the default. Cost: none." }
trigger_deadzone = { type = "int", default = 0, min = 0, max = 30, apply = "live", label = "Trigger deadzone", group = "controls", help = "How far a trigger must be pressed before it counts, in percent; past it the full range is kept. Raise it if the car creeps forward or brakes with the triggers released. 0 is the default. Cost: none." }
l3_skip_track = { type = "bool", default = true, apply = "live", label = "L3 skips music track", group = "controls", help = "Clicking the left stick skips to the next music track, like the T key." }
ps_icons = { type = "bool", default = true, apply = "restart", label = "PlayStation button icons", group = "controls", help = "Shows PlayStation button symbols in the menus when you use a controller. Needs XtendedInputButtons.tpk (the XtendedInput mod) in your game folder's GLOBAL folder; without it, or Off, the PC game's prompts show." }
shift_up = { type = "int", default = 7, min = -1, max = 11, apply = "live", label = "Shift up button", group = "controls", help = "Controller button for shifting up with manual gears. 7 is R2; -1 turns it off. The settings guide lists the other numbers." }
shift_down = { type = "int", default = 6, min = -1, max = 11, apply = "live", label = "Shift down button", group = "controls", help = "Controller button for shifting down with manual gears. 6 is L2; -1 turns it off. The settings guide lists the other numbers." }
shift_up_secondary = { type = "int", default = -1, min = -1, max = 11, apply = "live", label = "Shift up: second button", group = "controls", help = "An extra controller button for shifting up. -1 turns it off." }
shift_down_secondary = { type = "int", default = -1, min = -1, max = 11, apply = "live", label = "Shift down: second button", group = "controls", help = "An extra controller button for shifting down. -1 turns it off." }
impact_rumble = { type = "int", default = 100, min = 0, max = 200, apply = "live", label = "Rumble: crashes %", group = "feedback", help = "How hard the controller shakes when you hit something. 100 is normal; 0 turns it off." }
surface_rumble = { type = "int", default = 100, min = 0, max = 200, apply = "live", label = "Rumble: driving %", group = "feedback", help = "Shaking from the road surface, wheelspin, nitrous and gear shifts. 100 is normal; 0 turns it off." }
paved_surface_rumble = { type = "bool", default = true, apply = "live", label = "Rumble: cobbles and metal", group = "feedback", help = "Also rumbles on cobblestones, stone and metal surfaces. Off matches the Xbox 360, which stays still there." }
rumble_model = { type = "int", default = 1, min = 0, max = 1, apply = "live", choices = "PC wheel adaptation|Xbox 360", label = "Rumble style", group = "feedback", help = "Xbox 360 (the default): rumbles like the console. PC wheel adaptation: the PC version's steering-wheel feedback turned into rumble." }
collision_rumble_fade = { type = "int", default = 50, min = 10, max = 100, step = 10, apply = "live", label = "Rumble: crash fade %", group = "feedback", help = "How long the rumble lasts after a crash or scrape. 100 is the Xbox 360; lower is shorter." }
rumble_floor = { type = "int", default = 1, min = 0, max = 10, apply = "live", label = "Rumble: minimum strength %", group = "feedback", help = "Rumble weaker than this is skipped, so the controller does not buzz all the time. 0 plays everything." }
freeze_camera_key = { type = "bool", default = false, apply = "restart", label = "Pause key freezes the camera", group = "controls.keys", help = "While driving, the Pause/Break key freezes and unfreezes the camera, for screenshots. From Extra Options." }
light_keys = { type = "bool", default = false, apply = "restart", label = "Light keys (H and O)", group = "controls.keys", help = "While driving, H switches your headlights and O your police lights on and off. From Extra Options." }
debug_camera = { type = "bool", default = false, apply = "restart", label = "Free camera (Backspace)", group = "controls.keys", help = "While driving, Backspace switches to the game's free camera and back, for screenshots. From Extra Options." }
heat_keys = { type = "bool", default = false, apply = "restart", label = "Heat keys (F7 and Page Up)", group = "controls.keys", help = "While driving, F7 arms the heat keys and Page Up then steps the heat level between the lowest and highest heat settings. From Extra Options." }
look = { type = "int", default = 0, min = 0, max = 1, apply = "renderer", choices = "Definitive|Xbox 360", label = "Look (retired)", group = "hidden", help = "Retired: Definitive is the only look. A profile saved on Xbox 360 moves to Definitive once (logged), with the golden colour filter kept on. Not a choice." }
msaa = { type = "int", default = -1, min = -1, max = 1, apply = "live", label = "Anti-aliasing (old setting)", group = "hidden", help = "The anti-aliasing setting of 1.0 (-1 the game's own, 0 off, 1 4x). Read once and carried over to Smooth edges as Off; then reset to -1." }
spray_fill = { type = "int", default = 1, min = 1, max = 4, apply = "live", label = "Rain spray fill", group = "hidden", help = "Rain spray behind cars drawn from 1/K of the particles, each denser. 1 = as the game (larger values showed no speed gain)." }
settings_version = { type = "int", default = 0, min = 0, max = 100, apply = "live", label = "Settings version", group = "hidden", help = "The last one-time settings migration done (1: Xbox 360 sky 1 -> 2; 2: the Xbox 360 look retired). Not a choice." }
grass = { type = "int", default = 0, min = 0, max = 3, apply = "restart", choices = "Off|Low|Medium|High", label = "Grass", group = "hidden", help = "Retired in 2.0: always off, whatever was saved (no visible gain); the code stays for later." }
upscale_temporal = { type = "bool", default = false, apply = "restart", label = "Temporal upscaling (in development)", group = "hidden", help = "Not built yet (MetalFX temporal upscaling, planned); always off." }
appearance = { type = "int", default = 0, min = 0, max = 3, apply = "renderer", choices = "Definitive (default)|||Definitive - Custom", label = "Overall look", group = "hidden", help = "Definitive: the console-style look this port is built around. Custom: Definitive with your own changes below." }
golden_filter = { type = "int", default = 0, min = 0, max = 2, apply = "live", choices = "Auto|On|Off", label = "Golden colour filter (old setting)", group = "hidden", help = "The golden filter before the Look was retired (Auto followed the Look). Read once and moved to Golden colour filter. Not a choice." }
hud_vector = { type = "bool", default = true, apply = "restart", label = "HD HUD vector layer (old setting)", group = "hidden", help = "Merged into HD HUD (one switch since 3.0). Not a choice: the vector gauges and icons load whenever HD HUD is on." }
hybrid_exposure = { type = "int", default = 50, min = 0, max = 100, step = 10, apply = "live", label = "Auto brightness %", group = "hidden", help = "Like your eyes adjusting: tunnels get a bit brighter and bright daylight a bit darker. 0 turns it off." }
hybrid_vignette = { type = "int", default = 0, min = 0, max = 100, step = 25, apply = "live", label = "Darker screen edges %", group = "hidden", help = "Gently darkens the corners of the picture, like a camera lens. 0 is off." }
hybrid_shadows = { type = "int", default = 0, min = 0, max = 100, step = 10, apply = "live", label = "Brighter shadows %", group = "hidden", help = "Lifts the darkest parts of the picture so you can see detail in shadows. Black stays black. 0 is off." }
clean_pools_props = { type = "bool", default = false, apply = "restart", label = "Light pools on tunnel props", group = "hidden", help = "Adds local lamp lighting to eligible props (tunnel fans, pipes, gantries) in the main view. May increase stutter in busy scenes. Needs Light pools from lamps. Restart to apply." }
lamp_daylight = { type = "bool", default = false, apply = "live", label = "Street lamps off in daylight", group = "hidden", help = "Outdoor street lamps fade out while the sun is up and come on at dawn and dusk; tunnel lamps stay on. Their glow follows. Needs Light pools from lamps." }
dof_scene_depth = { type = "bool", default = true, apply = "live", label = "Blur: use the scene's own depth (advanced)", group = "hidden", help = "Retired from the menu in 2.0: always on (off only lost the blur in some rain frames)." }
mirror_grade = { type = "bool", default = false, apply = "live", label = "Mirror: match the main view (in development)", group = "hidden", help = "Gives the rear-view mirror the main view's brightness and shadow lift, so it no longer looks flat or too bright. Needs Mirror: keep sky detail. In development: off until approved." }
mirror_glass = { type = "int", default = 0, min = 0, max = 100, apply = "live", label = "Mirror: glass (in development)", group = "hidden", help = "Makes the mirror look like real glass: a slight cool tint, darker edges and a thin highlight along the top. 0 is the original. In development: off until approved." }
mirror_msaa = { type = "int", default = 0, min = 0, max = 1, apply = "restart", choices = "Off|4x", label = "Mirror: smooth edges (in development)", group = "hidden", help = "Smooths the jagged edges in the rear-view mirror with 4x multisampling, like the main picture (and smooths its leaves and fences). In development: off until approved. Restart to apply." }
mirror_pools = { type = "bool", default = false, apply = "live", label = "Mirror: light pools (in development)", group = "hidden", help = "Street lamps light the road and walls in the rear-view mirror too, as in the main picture. In development: off until approved." }
rain_amount = { type = "int", default = 100, min = 0, max = 300, apply = "restart", label = "Rain: amount %", group = "hidden", help = "How many raindrops there are. 100 is normal. Restart to apply." }
rain_intensity = { type = "int", default = 45, min = 0, max = 100, apply = "restart", label = "Rain: visibility %", group = "hidden", help = "How visible each raindrop is. Restart to apply." }
rain_reflection = { type = "int", default = 100, min = 0, max = 300, apply = "restart", label = "Rain: wet road shine %", group = "hidden", help = "How shiny and reflective wet roads look. Restart to apply." }
rain_size = { type = "int", default = 100, min = 1, max = 500, apply = "restart", label = "Rain: drop size", group = "hidden", help = "How big the raindrops are. 100 is normal. Restart to apply." }
rain_speed = { type = "int", default = 300, min = 0, max = 1000, apply = "restart", label = "Rain: falling speed", group = "hidden", help = "How fast the rain falls. Restart to apply." }
rain_crossing = { type = "int", default = 200, min = 0, max = 1000, apply = "restart", label = "Rain: sideways drift", group = "hidden", help = "How much the rain drifts sideways. Restart to apply." }
rain_gravity = { type = "int", default = 35, min = 0, max = 100, apply = "restart", label = "Rain: heaviness", group = "hidden", help = "How heavily the rain drops. Restart to apply." }
x360_exposure = { type = "bool", default = true, apply = "restart", label = "Post-processing (master switch)", group = "hidden", help = "Retired from the menu in 2.0: always on (off also broke the HDR highlight mark)." }
mod_hq_preset = { type = "bool", default = true, apply = "game_video", label = "Better top detail presets", group = "hidden", help = "Makes the game's highest detail presets use this port's higher quality settings." }
force_car_lod = { type = "int", default = -1, min = -1, max = 4, apply = "restart", label = "Car detail: force level", group = "hidden", help = "Forces one detail level for car models: -1 lets the game decide, 0 is the most detailed (from Extra Options). Restart to apply." }
force_tire_lod = { type = "int", default = -1, min = -1, max = 3, apply = "restart", label = "Wheel detail: force level", group = "hidden", help = "Forces one detail level for wheels: -1 lets the game decide, 0 is the most detailed (from Extra Options). Restart to apply." }
scenery_trace = { type = "bool", default = false, apply = "restart", label = "Log scenery pop-in", group = "hidden", help = "Writes scenery pop-in and flicker to the log, for bug reports. Restart to apply." }
sim_rate = { type = "int", default = 60, min = 30, max = 480, apply = "restart", label = "Game speed (keep 60)", group = "hidden", help = "How many times a second the game updates. Keep it at 60. Restart to apply." }
